[project]
name = "fastapi-zero"
version = "0.1.0"
description = ""
authors = [
    {name = "dannillojr",email = "dadanjunior.sales@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "fastapi[standard] (>=0.136.1,<0.137.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.15.12,<0.16.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "taskipy (>=1.14.1,<2.0.0)"
]
[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']

[tool.ruff.format]
preview = true
quote-style = "single"

[tool.pytest.ini.options]
pythonpath = "."
addopts = '-p no:warnings'

[tool.taskipy.tasks]

lint = 'ruff check .'  # Verifica lint do projeto
format = 'ruff check . --fix && ruff format .'  # Corrige e formata código
run = 'fastapi dev fastapi_zero/app.py'  # Inicia servidor FastAPI
pre_test = 'task lint'  # Executa lint antes dos testes
test = 'pytest -s -x --cov=fastapi_zero -vv'  # Executa testes com cobertura
post_test = 'coverage html'  # Gera relatório HTML de cobertura
